<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>For Madam Jii ❤️</title><style>html,body{margin:0;min-height:100%;background:#09070b;color:#fff;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}.wrap{width:min(92vw,560px);padding:32px 20px}.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}.heart{position:absolute;font-size:25px;animation:fall linear infinite;opacity:.85}.heart:nth-child(1){left:8%;animation-duration:7s}.heart:nth-child(2){left:28%;animation-duration:9s;animation-delay:1s}.heart:nth-child(3){left:52%;animation-duration:8s;animation-delay:2s}.heart:nth-child(4){left:76%;animation-duration:10s;animation-delay:.5s}.heart:nth-child(5){left:90%;animation-duration:7.5s;animation-delay:3s}@keyframes fall{from{transform:translateY(-15vh) rotate(0);opacity:0}15%{opacity:.9}to{transform:translateY(115vh) rotate(30deg);opacity:0}}.sticker{width:min(78vw,380px);max-height:48vh;object-fit:contain;border-radius:24px;filter:drop-shadow(0 0 25px rgba(255,105,180,.35));animation:float 3.5s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}h1{font-family:Georgia,serif;font-style:italic;font-size:clamp(34px,9vw,58px);margin:25px 0 8px;color:#ffb0d0}p{font-size:clamp(22px,5.5vw,32px);font-weight:700;margin:0;color:#fff}.voice{margin:20px auto 0;padding:14px 18px;border:1px solid #ff9fc655;border-radius:22px;background:#ffffff0b;width:min(380px,88vw);box-shadow:0 0 30px #ff4e9e18}.voice button{padding:13px 20px;border:0;border-radius:28px;background:#e889ae;color:#fff;font-weight:700;font-size:15px;box-shadow:0 0 25px #e889ae44}.voice button.playing{background:#c95f91}.hint{font-size:11px;font-weight:400;color:#b9aab2;margin-top:8px}.back{display:inline-block;margin-top:28px;padding:12px 22px;border:1px solid #777;border-radius:30px;color:#fff;text-decoration:none;background:#ffffff12}</style></head><body><div class="hearts"><span class="heart">💗</span><span class="heart">💕</span><span class="heart">❤️</span><span class="heart">💖</span><span class="heart">💗</span></div><main class="wrap"><img class="sticker" src="IMG_1346.gif" alt="cute animated sticker"><h1>I love you very much</h1><p>Madam jii (Maalkin jii) ❤️</p><div class="voice"><button id="voiceBtn">▶ Tap to hear my voice ❤️</button><div class="hint">A little something from my heart 🎙️</div><audio id="voice" preload="metadata"></audio></div><a class="back" href="heartfelt.html">← Back</a></main><script>const voice=document.getElementById('voice'),btn=document.getElementById('voiceBtn');voice.src='last-page-voice-note.mp3?v='+Date.now();voice.load();btn.onclick=async()=>{try{if(voice.paused){await voice.play();btn.textContent='⏸ Playing my voice…';btn.classList.add('playing')}else{voice.pause();btn.textContent='▶ Tap to hear my voice ❤️';btn.classList.remove('playing')}}catch(e){btn.textContent='Tap again to play ❤️'}};voice.onended=()=>{btn.textContent='▶ Hear my voice again ❤️';btn.classList.remove('playing')};</script></body></html>
